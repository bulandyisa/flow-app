name: Build Code Bundle

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'bot/**'
      - 'rules/**'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get version
        id: version
        run: echo "version=$(node -p 'require(\"./package.json\").version')" >> $GITHUB_OUTPUT

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Create code bundle
        run: |
          mkdir -p bundle/packages/shared bundle/packages/server bundle/packages/client
          mkdir -p bundle/bot bundle/rules

          # shared
          cp -r packages/shared/dist bundle/packages/shared/
          cp packages/shared/package.json bundle/packages/shared/

          # server dist + production deps
          cp -r packages/server/dist bundle/packages/server/
          cp packages/server/package.json bundle/packages/server/
          cd bundle/packages/server && npm install --omit=dev 2>/dev/null && cd ../../..

          # client
          cp -r packages/client/dist bundle/packages/client/

          # bot
          cp bot/flow_bot.py bundle/bot/
          [ -f bot/r2_storage.py ] && cp bot/r2_storage.py bundle/bot/
          [ -f bot/run_safe.bat ] && cp bot/run_safe.bat bundle/bot/

          # rules
          cp rules/* bundle/rules/

          # meta
          cp package.json bundle/
          echo '{"version":"${{ steps.version.outputs.version }}","builtAt":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > bundle/version.json

          # zip
          cd bundle && zip -r ../code-bundle.zip . && cd ..

      - name: Upload code bundle
        uses: actions/upload-artifact@v4
        with:
          name: code-bundle-${{ steps.version.outputs.version }}
          path: code-bundle.zip
